<div class="prose max-w-none p-4">
    <h1 class="text-gray-900">{{ test_data.test_name }}</h1>
    <p class="text-lg text-gray-600">Please respond to each statement based on how you've been feeling recently.</p>
    
    <form hx-post="/ui/submit_assessment"
          hx-target="#content-workspace"
          hx-swap="innerHTML"
          hx-indicator="#assessment-loading"
          class="mt-6">
        
        <input type="hidden" name="session_data_json" value='{{ session_data | tojson | safe }}'>
        
        <div class="space-y-6">
            {% for question in test_data.test_data %}
            <div class="p-4 bg-white rounded-lg shadow-sm border">
                <p class="font-semibold text-gray-800 mb-4">{{ loop.index }}. {{ question.question_text }}</p>
                <div class="space-y-2">
                    {% for option in question.options %}
                    <label class="flex items-center space-x-3 p-2 rounded hover:bg-gray-50 cursor-pointer">
                        <input type="radio" 
                               name="question_{{ question.question_id }}" 
                               value="{{ option.option_id }}" 
                               required 
                               class="form-radio text-blue-600 focus:ring-blue-500">
                        <span class="text-gray-700">{{ option.text }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
        </div>
        
        <div class="mt-8 flex flex-col space-y-2">
            <button type="submit" 
                    class="w-full p-3 bg-green-600 text-white font-bold rounded-md hover:bg-green-700 disabled:opacity-50">
                Submit Assessment
            </button>
            
            <div id="assessment-loading" class="htmx-indicator text-center text-sm text-gray-500">
                Processing your assessment...
            </div>
        </div>
    </form>
</div>
