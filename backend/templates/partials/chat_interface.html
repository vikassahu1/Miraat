<!-- Chat History Section: Professional message area with avatars -->
<div class="chat-wrapper">
    <div id="chat-history" class="chat-history custom-scrollbar">
        <!-- Loop through existing conversation history -->
        {% for turn in session_data.conversation_history %}
            <div class="message-container">
                {% if turn.role == 'assistant' %}
                <div class="message-row assistant">
                    <div class="message-avatar assistant">🤖</div>
                    <div class="message-bubble assistant chat-message">
                        <div class="message-content">{{ turn.content | safe }}</div>
                    </div>
                </div>
                {% else %}
                <div class="message-row user" style="justify-content: flex-end; flex-direction: row-reverse; text-align: right;">
                    <div class="message-avatar user">👤</div>
                    <div class="message-bubble user chat-message">
                        <div class="message-content">{{ turn.content | safe }}</div>
                    </div>
                </div>
                {% endif %}
            </div>
        {% endfor %}
    </div>

    <!-- Chat Input Form Section: Professional input area with round send button -->
    <div class="chat-input-section">
        <!-- HTMX form for sending messages -->
        <form class="input-form" hx-post="/ui/conversation_turn" 
              hx-target="#chat-container" 
              hx-swap="innerHTML"
              hx-disabled-elt=".submit-button, .message-textarea">
            
            <!-- Hidden field to maintain session state -->
            {% if session_data and session_data.session_id %}
            <input type="hidden" name="session_data_json" value='{{ session_data | tojson | safe }}'>
            {% endif %}
            
            <div class="form-container">
                <!-- Message input textarea with auto-resize prevention -->
                <textarea name="user_input" 
                         class="message-textarea" 
                         required 
                         placeholder="Type your message here..."
                         rows="1"
                         maxlength="1000"></textarea>
                
                <!-- Professional round send button with arrow icon -->
                <button id="chat-send-button"  type="submit" class="submit-button" title="Send message">
                    <svg class="send-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                                    <script>
                                    // Submit form on Enter (unless Shift is held)
                                    document.addEventListener('DOMContentLoaded', function() {
                                        document.querySelector('.message-textarea').addEventListener('keydown', function(e) {
                                            if (e.key === 'Enter' && !e.shiftKey) {
                                                e.preventDefault();
                                                const form = e.target.closest('form');
                                                if (form && e.target.value.trim()) {
                                                    form.submit();
                                                }
                                            }
                                        });
                                    });
                                    </script>
            </div>
            
            <!-- Loading indicator in input area -->
            <div id="loading-message" class="input-loading-indicator" style="display: none;">
                <div class="loading-content">
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                    <span style="margin-left: 12px; color: #6b7280; font-size: 0.875rem; font-weight: 500;">AI is analyzing your message...</span>
                </div>
            </div>
        </form>
    </div>
</div>
