<div class="max-w-3xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-8">
        <div class="bg-green-100 text-green-600 rounded-full p-3 w-16 h-16 mx-auto mb-4 flex items-center justify-center">
            <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Assessment Complete</h1>
        <p class="text-gray-600">Your mental health assessment has been processed. Here are your results:</p>
    </div>

    <!-- Results Cards -->
    <div class="space-y-6">
        <!-- Personal Summary -->
        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-lg p-6">
            <div class="flex items-start">
                <div class="bg-blue-100 text-blue-600 rounded-full p-2 mr-4 mt-1">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-6-3a2 2 0 11-4 0 2 2 0 014 0zm-2 4a5 5 0 00-4.546 2.916A5.986 5.986 0 0010 16a5.986 5.986 0 004.546-2.084A5 5 0 0010 11z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div class="flex-1">
                    <h2 class="text-xl font-semibold text-blue-900 mb-3">Personal Summary</h2>
                    <p class="text-blue-800 leading-relaxed">{{ report.opening_summary }}</p>
                </div>
            </div>
        </div>

        <!-- Assessment Findings -->
        <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
            <div class="flex items-start">
                <div class="bg-gray-100 text-gray-600 rounded-full p-2 mr-4 mt-1">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div class="flex-1">
                    <h2 class="text-xl font-semibold text-gray-900 mb-3">Assessment Results</h2>
                    <p class="text-gray-700 leading-relaxed">{{ report.assessment_findings }}</p>
                </div>
            </div>
        </div>

        <!-- Recommended Steps -->
        <div class="bg-gradient-to-r from-green-50 to-emerald-50 border border-green-200 rounded-lg p-6">
            <div class="flex items-start">
                <div class="bg-green-100 text-green-600 rounded-full p-2 mr-4 mt-1">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div class="flex-1">
                    <h2 class="text-xl font-semibold text-green-900 mb-3">Recommended Next Steps</h2>
                    <p class="text-green-800 leading-relaxed">{{ report.recommended_steps }}</p>
                </div>
            </div>
        </div>

        <!-- Disclaimer -->
        <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-6">
            <div class="flex items-start">
                <div class="bg-yellow-100 text-yellow-600 rounded-full p-2 mr-4 mt-1">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div class="flex-1">
                    <h2 class="text-lg font-semibold text-yellow-900 mb-2">Important Disclaimer</h2>
                    <p class="text-yellow-800 text-sm leading-relaxed">{{ report.disclaimer }}</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="mt-8 flex flex-col sm:flex-row gap-4 justify-center">
        <button onclick="window.print()" 
                class="px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
            Save Results
        </button>
        <button onclick="location.href='/ui/hi'" 
                class="px-6 py-3 bg-gray-600 text-white font-medium rounded-lg hover:bg-gray-700 focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors">
            Start New Assessment
        </button>
    </div>
</div>
