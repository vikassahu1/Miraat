<!-- This template replaces the entire #chat-container during the conversation -->
<div id="chat-history" class="flex-grow p-4 space-y-4 overflow-y-auto flex flex-col">
    {% for turn in session_data.conversation_history %}
        {% include "partials/chat_bubble.html" with {'role': turn.role, 'message': turn.content} %}
    {% endfor %}
</div>

<div id="chat-form-container" class="p-4 border-t bg-white">
    <!-- This form uses Alpine.js to get the session_data -->
    <form hx-post="/api/v1/conversation/respond"
          hx-target="#chat-container"
          hx-swap="innerHTML"
          hx-indicator="#loading-spinner"
          hx-vals="js:{session_data: sessionData}">
        <textarea name="user_answer" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500" required placeholder="Type your response..."></textarea>
        <button type="submit" class="w-full mt-2 p-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700">Send</button>
        <div id="loading-spinner" class="htmx-indicator text-center p-2 text-gray-500">Thinking...</div>
    </form>
</div>
