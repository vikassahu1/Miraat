<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraat - Mental Health Assessment</title>
    <link href="/static/css/output.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
    <style>
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: block;
        }
        .htmx-request button {
            opacity: 0.6;
            pointer-events: none;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-message {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden">
    <div class="flex h-full">
        <!-- Left Panel: Chat Interface -->
        <div class="w-1/3 bg-white border-r border-gray-200 flex flex-col">
            <div class="bg-blue-600 text-white p-4 border-b">
                <h2 class="text-lg font-semibold">AI Mental Health Assistant</h2>
                <p class="text-blue-100 text-sm">Your private conversation space</p>
            </div>
            
            <div id="chat-container" class="flex-1 flex flex-col"
                 hx-get="/ui/initial_chat_view"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <!-- Chat content will load here -->
            </div>
        </div>

        <!-- Right Panel: Assessment & Results -->
        <div class="w-2/3 bg-gray-50 flex flex-col">
            <div class="bg-white p-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-800">Assessment Workspace</h2>
                <p class="text-gray-600 text-sm">Tests and results will appear here</p>
            </div>
            
            <div id="content-workspace" class="flex-1 p-6 overflow-y-auto"
                 hx-get="/ui/welcome_view"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <!-- Assessment content will load here -->
            </div>
        </div>
    </div>

    <script>
        // Auto-scroll chat to bottom when new messages arrive
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            const chatHistory = document.getElementById('chat-history');
            if (chatHistory) {
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }
        });

        // Add fade-in effect to new content
        document.body.addEventListener('htmx:afterSettle', function(evt) {
            if (evt.target.classList) {
                evt.target.classList.add('fade-in');
            }
        });
    </script>
</body>
</html>
