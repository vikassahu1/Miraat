<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraat - Mental Health Assessment</title>
    <link href="/static/css/custom-styles.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* HTMX Loading States */
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: block;
        }
        .htmx-request button {
            opacity: 0.6;
            pointer-events: none;
        }
        
        /* Animation Styles */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-message {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Layout Fixes for Full Height */
        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        
        /* Custom Scrollbar Styling */
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: rgba(156, 163, 175, 0.5) transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: rgba(156, 163, 175, 0.8);
        }
    </style>
</head>
<body class="main-container">

    <div id="content-container" class="content-wrapper">
            <div id="chat-heading" class="chat-header">
                <div class="chat-header-left">
                    <div class="chat-status-indicator"></div>
                    <div>
                        <h2>Miraat AI Assistant</h2>
                        <p>Secure & Confidential Mental Health Support</p>
                    </div>
                </div>
            </div>
            
            <div id="chat-container" class="chat-container"
                 hx-get="/ui/initial_chat_view"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <!-- Chat content -->
            </div>
        </div>


    <!-- For redirect to the main page  -->
    <script>
            window.onload = function() {
                // Check if the token is present in localStorage
                const token = localStorage.getItem("authToken");
                if (!token) {
                    alert("You need to login to access this page");
                    window.location.href = '/login';
                }
            };
    </script>

    <script>
        // HTMX Event Handlers for Enhanced User Experience
        
        // When a request starts, show loading indicator in input area
        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            if (evt.detail.elt.classList.contains('input-form')) {
                console.log('🚀 Request starting - showing loader in input area');
                
                // Show the loading indicator below the input
                const loader = document.getElementById('loading-message');
                if (loader) {
                    loader.classList.add('show');
                    loader.style.display = 'block';
                }
                
                // Hide the textarea and button (they'll be replaced by loader)
                const textarea = document.querySelector('.message-textarea');
                const button = document.querySelector('.submit-button');
                if (textarea) textarea.style.visibility = 'hidden';
                if (button) button.style.visibility = 'hidden';
            }
        });

        // Auto-scroll chat to bottom when new messages arrive
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            console.log('✅ Response received - hiding loader');
            
            // Hide the loading indicator
            const loader = document.getElementById('loading-message');
            if (loader) {
                loader.classList.remove('show');
                loader.style.display = 'none';
            }
            
            // Show textarea and button again
            const textarea = document.querySelector('.message-textarea');
            const button = document.querySelector('.submit-button');
            if (textarea) {
                textarea.style.visibility = 'visible';
                textarea.value = '';
                textarea.style.height = 'auto';
                textarea.focus();
            }
            if (button) button.style.visibility = 'visible';
            
            // Scroll chat history to bottom
            const chatHistory = document.getElementById('chat-history');
            if (chatHistory) {
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }
        });

        // Add smooth fade-in animation to newly loaded content
        // Provides visual feedback when content updates via HTMX
        document.body.addEventListener('htmx:afterSettle', function(evt) {
            if (evt.target.classList) {
                evt.target.classList.add('fade-in');
            }
        });

        // Professional textarea auto-resize functionality
        document.addEventListener('input', function(e) {
            if (e.target.matches('.message-textarea')) {
                e.target.style.height = 'auto';
                e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
            }
        });

        // Enter key to send (Shift+Enter for new line)
        document.addEventListener('keydown', function(e) {
            if (e.target.matches('.message-textarea')) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    const form = e.target.closest('form');
                    if (form && e.target.value.trim()) {
                        form.querySelector('.submit-button').click();
                    }
                }
            }
        });
    </script>
</body>
</html>
