<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraat - Mental Health Assessment</title>
    <link href="/static/css/output.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
    <style>
        /* HTMX Loading States */
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: block;
        }
        .htmx-request button {
            opacity: 0.6;
            pointer-events: none;
        }
        
        /* Animation Styles */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-message {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Layout Fixes for Full Height */
        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        
        /* Custom Scrollbar Styling */
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: rgba(156, 163, 175, 0.5) transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: rgba(156, 163, 175, 0.8);
        }
    </style>
</head>
<body class="flex items-center justify-center overflow-hidden">

    <div id="content-container" class="flex flex-col items-center justify-center h-[100vh] w-[50vw] bg-slate-900 pt-10">
            <!-- Chat Header: Branding and description -->
            <div id="chat-heading" class="flex flex-col items-center justify-center text-black flex-shrink-0 w-full" style="height:12vh;">
                <h2 class="text-2xl font-bold text-center">AI Mental Health Assistant</h2>
                <p class="text-blue-100 text-sm mt-1 text-center">Your private conversation space</p>
            </div>
            
            <div id="chat-container" class="flex-1 flex flex-col w-full"
                 hx-get="/ui/initial_chat_view"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <!-- Chat content -->
            </div>
        </div>


    <script>
        // HTMX Event Handlers for Enhanced User Experience
        
        // Auto-scroll chat to bottom when new messages arrive
        // This ensures users always see the latest message without manual scrolling
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            const chatHistory = document.getElementById('chat-history');
            if (chatHistory) {
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }
        });

        // Add smooth fade-in animation to newly loaded content
        // Provides visual feedback when content updates via HTMX
        document.body.addEventListener('htmx:afterSettle', function(evt) {
            if (evt.target.classList) {
                evt.target.classList.add('fade-in');
            }
        });
    </script>
</body>
</html>
