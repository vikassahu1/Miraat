{% extends "base.html" %} 

{% block title %}Test History{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-center">Your Assessment History</h1>
    <div class="h-1 w-16 bg-green-400 mx-auto my-4"></div>
    
    <div id="history-container" class="max-w-4xl mx-auto">
        <p class="text-gray-600 text-center">Loading your history...</p>
    </div>
</div>
{% endblock %}

{% block all_scripts %}
<script>
    // --- Global Scope for Functions Called by HTML ---
    window.downloadReport = function(testId) {
        const username = localStorage.getItem("username");
        if (!username) {
            alert("Authentication error. Please log in again.");
            return;
        }
        // This will trigger the browser's download functionality
        window.location.href = `/api/v1/history/${testId}/report?user_name=${username}`;
    };

    window.deleteTest = async function(testId) {
        const username = localStorage.getItem("username");
        if (!username) {
            alert("Authentication error. Please log in again.");
            return;
        }

        if (!confirm('Are you sure you want to permanently delete this assessment history?')) return;
        
        try {
            const response = await fetch(`/api/v1/history/${testId}?user_name=${username}`, {
                method: 'DELETE',
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || 'Failed to delete test');
            }
            
            // If successful, refresh the history list
            fetchTestHistory();

        } catch (error) {
            console.error('Error deleting test:', error);
            alert('Error deleting test: ' + error.message);
        }
    };

    // --- Main Logic ---
    document.addEventListener('DOMContentLoaded', function() {
        const username = localStorage.getItem("username");
        
        if (!username) {
            // Handle not logged in state
            const historyContainer = document.getElementById("history-container");
            historyContainer.innerHTML = `
                <div class="text-center p-8 bg-yellow-50 border border-yellow-200 rounded-lg">
                    <p class="font-semibold text-yellow-800">You are not logged in.</p>
                    <p class="text-yellow-700 mt-2">Please <a href="/login" class="underline font-bold">log in</a> to view your assessment history.</p>
                </div>
            `;
        } else {
            fetchTestHistory();
        }
    });

    async function fetchTestHistory() {
        const username = localStorage.getItem("username");
        const historyContainer = document.getElementById("history-container");
        historyContainer.innerHTML = '<p class="text-gray-600 text-center">Loading your history...</p>';

        try {
            const response = await fetch(`/api/v1/history/user-history?user_name=${username}`);
            if (!response.ok) throw new Error("Failed to fetch test history");
            
            const data = await response.json();
            renderTestHistory(data);
        } catch (error) {
            console.error(error);
            historyContainer.innerHTML = '<p class="text-red-500 text-center">Error loading test history.</p>';
        }
    }

    function renderTestHistory(data) {
        const historyContainer = document.getElementById("history-container");
        
        if (data.length === 0) {
            historyContainer.innerHTML = `
                <div class="text-center p-8 bg-blue-50 border border-blue-200 rounded-lg">
                    <p class="font-semibold text-blue-800">No History Found</p>
                    <p class="text-blue-700 mt-2">You have not completed any assessments yet. <a href="/assess" class="underline font-bold">Start a new one</a>.</p>
                </div>
            `;
            return;
        }

        const tableHTML = `
            <div class="overflow-x-auto bg-white rounded-lg shadow border border-gray-200">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">#</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Test ID</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date Completed</th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        ${data.map((test, index) => `
                            <tr>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-500">${index + 1}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${test.test_id}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(test.date).toLocaleString()}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
                                    <button onclick="downloadReport(${test.test_id})" 
                                            class="px-3 py-1.5 bg-green-500 text-white rounded hover:bg-green-600 transition-colors font-medium shadow-sm">
                                        Download PDF
                                    </button>
                                    <button onclick="deleteTest(${test.test_id})" 
                                            class="px-3 py-1.5 bg-red-500 text-white rounded hover:bg-red-600 transition-colors font-medium shadow-sm">
                                        Delete
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>`;
            
        historyContainer.innerHTML = tableHTML;
    }
</script>
{% endblock %}
